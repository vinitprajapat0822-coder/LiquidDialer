name: Install PhoneX source replacement
on:
  push:
    branches: [main]
    paths:
      - "phonex-payload/READY"
permissions:
  contents: write
jobs:
  build-and-replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Assemble uploaded PhoneX source archive
        run: |
          cat phonex-payload/part*.b64 | base64 -d > /tmp/phonex-source.zip
          unzip -q /tmp/phonex-source.zip -d /tmp/phonex-unpacked
          test -f /tmp/phonex-unpacked/PhoneX-Liquid-Glass-Dialer/app/build.gradle.kts
          test -f /tmp/phonex-unpacked/PhoneX-Liquid-Glass-Dialer/app/src/main/AndroidManifest.xml
      - name: Install Android SDK components
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Build and test PhoneX before replacing the old project
        run: |
          gradle --no-daemon -p /tmp/phonex-unpacked/PhoneX-Liquid-Glass-Dialer \
            :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Upload verified debug APK
        uses: actions/upload-artifact@v4
        with:
          name: PhoneX-debug-apk
          path: /tmp/phonex-unpacked/PhoneX-Liquid-Glass-Dialer/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Replace old LiquidDialer source with PhoneX
        run: |
          PROJECT=/tmp/phonex-unpacked/PhoneX-Liquid-Glass-Dialer
          rm -rf app gradle docs .github
          rm -f BUILD_INSTRUCTIONS.txt README.md build.gradle.kts gradle.properties settings.gradle.kts
          cp -a "$PROJECT"/. .
          rm -rf phonex-payload
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "feat: replace LiquidDialer with PhoneX Liquid Glass Dialer"
          git push origin HEAD:main
